<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="720" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Create — 글쓰기 (POST)</text>

  <rect x="120" y="55" width="400" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="87" text-anchor="middle" font-size="14" fill="#1f2937">write.html: 닉네임/비밀번호/제목/내용 입력 후 [등록]</text>

  <line x1="320" y1="110" x2="320" y2="143" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="145" width="400" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="168" text-anchor="middle" font-size="13" fill="#1f2937">비밀번호 해시 변환</text>
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="#4B5563">"1234" → "$2b$10$Xy8f..."</text>

  <line x1="320" y1="200" x2="320" y2="233" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="235" width="500" height="110" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="90" y="260" font-size="14" font-weight="bold" fill="#1f2937">POST /api/posts</text>
  <text x="90" y="282" font-size="12" fill="#374151" font-family="monospace">{ "nickname": "홍길동", "password": "1234",</text>
  <text x="90" y="300" font-size="12" fill="#374151" font-family="monospace">  "title": "안녕하세요", "content": "첫 글입니다" }</text>
  <text x="90" y="325" font-size="12" fill="#6B7280">브라우저 → 서버로 전송되는 요청</text>

  <line x1="320" y1="345" x2="320" y2="378" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="380" width="460" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="320" y="404" text-anchor="middle" font-size="13" fill="#1f2937">API Function: 필수값 검사 통과</text>
  <text x="320" y="424" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">db.collection('posts').insertOne({ nickname, passwordHash, ... })</text>

  <line x1="320" y1="450" x2="320" y2="483" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="485" width="400" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="320" y="510" text-anchor="middle" font-size="13" fill="#1f2937">MongoDB: posts 컬렉션에 새 문서 추가</text>
  <text x="320" y="528" text-anchor="middle" font-size="12" fill="#4B5563">_id가 자동으로 생성됨 (ObjectId)</text>

  <line x1="320" y1="545" x2="320" y2="578" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="580" width="360" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="320" y="610" text-anchor="middle" font-size="13" fill="#1f2937">201 Created + 새 글 정보 응답</text>

  <line x1="320" y1="630" x2="320" y2="653" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="655" width="360" height="30" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="675" text-anchor="middle" font-size="13" fill="#1f2937">index.html (글 목록)으로 이동</text>
</svg>
