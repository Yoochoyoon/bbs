<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="640" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Read (목록) — 페이지네이션 + 검색 (GET)</text>

  <rect x="90" y="55" width="460" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="87" text-anchor="middle" font-size="14" fill="#1f2937">index.html 접속 / 2페이지 클릭 / "안녕" 검색어 입력</text>

  <line x1="320" y1="110" x2="320" y2="143" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="145" width="460" height="50" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">GET /api/posts?page=2&amp;search=안녕</text>

  <line x1="320" y1="195" x2="320" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="230" width="520" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="80" y="255" font-size="13" fill="#1f2937">API Function: page=2 → 11번째 글부터 10개 (10개 건너뛰고 10개)</text>
  <text x="80" y="277" font-size="13" fill="#1f2937">제목에 "안녕" 포함된 글만 필터</text>
  <text x="80" y="303" font-size="12" font-family="monospace" fill="#374151">db.collection('posts')</text>
  <text x="80" y="321" font-size="12" font-family="monospace" fill="#374151">  .find({ title: /안녕/ }).sort({createdAt:-1}).skip(10).limit(10)</text>

  <line x1="320" y1="340" x2="320" y2="373" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="375" width="400" height="55" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="320" y="399" text-anchor="middle" font-size="13" fill="#1f2937">MongoDB: 조건에 맞는 최대 10개 문서 반환</text>
  <text x="320" y="417" text-anchor="middle" font-size="12" fill="#4B5563">(content, passwordHash 필드는 애초에 안 가져옴)</text>

  <line x1="320" y1="430" x2="320" y2="463" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="465" width="360" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="320" y="495" text-anchor="middle" font-size="13" fill="#1f2937">200 OK + 글 배열(JSON) 응답</text>

  <line x1="320" y1="515" x2="320" y2="548" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="550" width="440" height="55" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="574" text-anchor="middle" font-size="13" fill="#1f2937">index.html이 JS로 목록을 화면에 렌더링</text>
  <text x="320" y="592" text-anchor="middle" font-size="12" fill="#4B5563">하단에 [1] [2] [3] 페이지 버튼 표시</text>
</svg>
