<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="680" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Read (상세) — 조회수 증가 포함 (GET)</text>

  <rect x="120" y="55" width="400" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="85" text-anchor="middle" font-size="14" fill="#1f2937">글 목록에서 5번 글 클릭 → post.html?id=5</text>

  <line x1="320" y1="105" x2="320" y2="138" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="140" width="340" height="45" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="168" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">GET /api/posts/5</text>

  <line x1="320" y1="185" x2="320" y2="218" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="220" width="520" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="80" y="245" font-size="13" font-family="monospace" fill="#1f2937">① db.collection('posts').findOne({ _id: 5 })</text>
  <text x="80" y="265" font-size="12" fill="#4B5563">없으면 → 404 반환하고 종료</text>

  <line x1="320" y1="280" x2="320" y2="313" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="315" width="520" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="340" font-size="13" fill="#1f2937">② 있으면 → viewCount를 1 증가시키는 업데이트 실행</text>
  <text x="80" y="360" font-size="12" font-family="monospace" fill="#374151">db.collection('posts').updateOne({_id:5}, { $inc: { viewCount: 1 } })</text>

  <line x1="320" y1="375" x2="320" y2="408" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="410" width="520" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="80" y="440" font-size="13" font-family="monospace" fill="#1f2937">③ db.collection('comments').find({ postId: 5 })</text>

  <line x1="320" y1="460" x2="320" y2="493" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="495" width="460" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="320" y="519" text-anchor="middle" font-size="13" fill="#1f2937">200 OK 응답</text>
  <text x="320" y="539" text-anchor="middle" font-size="12" fill="#4B5563">{ 글 내용, 이미지, 조회수, 댓글목록 }</text>

  <line x1="320" y1="555" x2="320" y2="588" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="590" width="360" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="620" text-anchor="middle" font-size="13" fill="#1f2937">post.html이 JS로 상세 화면 렌더링</text>

  <line x1="320" y1="640" x2="320" y2="640" stroke="none"/>
  <text x="320" y="665" text-anchor="middle" font-size="12" fill="#6B7280">※ Read인데 그 안에서 viewCount를 바꾸는 Update가 함께 일어나는 특이 케이스</text>
</svg>
