<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="440" fill="#ffffff"/>
  <text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">비밀번호 해싱 원리</text>

  <!-- 상단: 글쓰기 -->
  <text x="30" y="60" font-size="14" font-weight="bold" fill="#1f2937">글쓰기 할 때</text>

  <rect x="30" y="70" width="110" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" font-size="14" font-family="monospace" fill="#1f2937">"1234"</text>

  <line x1="140" y1="95" x2="188" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="70" width="170" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="275" y="100" text-anchor="middle" font-size="13" fill="#1f2937">해시 함수 (bcrypt)</text>

  <line x1="360" y1="95" x2="408" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="410" y="70" width="190" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="505" y="100" text-anchor="middle" font-size="12" font-family="monospace" fill="#1f2937">"$2b$10$Xy8f..."</text>

  <line x1="600" y1="95" x2="648" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="70" width="70" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="685" y="100" text-anchor="middle" font-size="12" fill="#1f2937">DB 저장</text>

  <line x1="505" y1="120" x2="505" y2="160" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <line x1="85" y1="160" x2="505" y2="160" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="85" y1="160" x2="85" y2="122" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="295" y="178" text-anchor="middle" font-size="12" fill="#DC2626">✕ 원본 "1234"로 되돌릴 수 없음 (단방향)</text>

  <line x1="30" y1="200" x2="710" y2="200" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 하단: 검증 -->
  <text x="30" y="235" font-size="14" font-weight="bold" fill="#1f2937">수정/삭제 할 때 (검증)</text>

  <rect x="30" y="245" width="110" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="85" y="275" text-anchor="middle" font-size="14" font-family="monospace" fill="#1f2937">"1234"</text>
  <text x="85" y="310" text-anchor="middle" font-size="11" fill="#6B7280">(다시 입력)</text>

  <line x1="140" y1="270" x2="188" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="245" width="170" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="275" y="275" text-anchor="middle" font-size="13" fill="#1f2937">같은 해시 함수</text>

  <line x1="360" y1="270" x2="408" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="410" y="245" width="190" height="50" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="505" y="275" text-anchor="middle" font-size="12" font-family="monospace" fill="#1f2937">"$2b$10$Xy8f..."</text>

  <rect x="410" y="325" width="190" height="45" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="505" y="352" text-anchor="middle" font-size="11" fill="#1f2937">DB에 저장된 값</text>

  <line x1="505" y1="295" x2="505" y2="373" stroke="#374151" stroke-width="2"/>
  <line x1="505" y1="370" x2="505" y2="373" stroke="#374151" stroke-width="0"/>

  <line x1="600" y1="270" x2="648" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="347" x2="648" y2="335" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="290" width="80" height="80" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="690" y="320" text-anchor="middle" font-size="12" fill="#1f2937">문자열</text>
  <text x="690" y="337" text-anchor="middle" font-size="12" fill="#1f2937">비교</text>
  <text x="690" y="358" text-anchor="middle" font-size="12" fill="#1f2937">✅/❌</text>
</svg>
