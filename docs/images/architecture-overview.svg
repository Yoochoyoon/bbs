<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="480" fill="#ffffff"/>

  <!-- Vercel dashed wrapper -->
  <rect x="130" y="95" width="340" height="170" rx="10" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="140" y="88" font-size="13" fill="#6B7280">Vercel (무료 배포)</text>

  <!-- 브라우저 -->
  <rect x="190" y="20" width="220" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" font-size="15" fill="#1f2937">브라우저 (사용자)</text>

  <line x1="300" y1="70" x2="300" y2="108" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="93" font-size="12" fill="#374151">① HTML/CSS/JS 페이지 요청</text>

  <!-- 정적 페이지 -->
  <rect x="150" y="110" width="300" height="50" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-size="13" fill="#1f2937">index.html / post.html / write.html</text>

  <line x1="300" y1="160" x2="300" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="183" font-size="12" fill="#374151">② fetch('/api/...')</text>

  <!-- API Routes -->
  <rect x="150" y="200" width="300" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="300" y="223" text-anchor="middle" font-size="13" fill="#1f2937">Vercel Serverless Functions</text>
  <text x="300" y="241" text-anchor="middle" font-size="11" fill="#4B5563">(/api, 프레임워크 없음)</text>

  <line x1="300" y1="250" x2="300" y2="288" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="273" font-size="12" fill="#374151">③ DB / 이미지 처리</text>

  <!-- MongoDB + Blob -->
  <rect x="90" y="320" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="190" y="348" text-anchor="middle" font-size="13" fill="#1f2937">MongoDB Atlas</text>
  <text x="190" y="368" text-anchor="middle" font-size="12" fill="#4B5563">posts, comments 컬렉션</text>

  <rect x="310" y="320" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="410" y="348" text-anchor="middle" font-size="13" fill="#1f2937">Vercel Blob</text>
  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#4B5563">이미지 파일</text>

  <text x="300" y="440" text-anchor="middle" font-size="12" fill="#6B7280">④ 결과(JSON)는 반대 방향(DB/Blob → API → 페이지 → 브라우저)으로 되돌아옵니다</text>
</svg>
